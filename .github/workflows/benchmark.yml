name: Benchmark attempts

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke runs one seed; release runs five"
        required: true
        type: choice
        options: [smoke, release]
        default: smoke
      adapter:
        description: "Evaluated adapter"
        required: true
        type: choice
        options: [cli, noop]
        default: cli
      adapter_config:
        description: "Repository-relative MEA adapter YAML"
        required: true
        default: "mea.adapter.yaml"
      timeout:
        description: "Timeout in seconds"
        required: true
        default: "900"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.profile == 'smoke'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        challenge:
          - 01_novel_repair
          - 02_long_horizon
          - 03_self_improvement
          - 04_adversarial_security
          - 05_containment_rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMARK_ADAPTER: ${{ inputs.adapter }}
      BENCHMARK_ADAPTER_CONFIG: ${{ inputs.adapter_config }}
      BENCHMARK_TIMEOUT: ${{ inputs.timeout }}
      BENCHMARK_CHALLENGE: ${{ matrix.challenge }}
      BENCHMARK_SEED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark
        run: python -m pip install --disable-pip-version-check .
      - name: Run isolated MEA attempt and archive evidence
        run: bash scripts/run_attempt_job.sh
      - name: Upload private attempt evidence
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: always()
        with:
          name: attempt-${{ matrix.challenge }}-seed-0
          path: |
            attempt-*.tar.gz
            attempt-*.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14

  attempt:
    if: inputs.profile == 'release'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        challenge:
          - 01_novel_repair
          - 02_long_horizon
          - 03_self_improvement
          - 04_adversarial_security
          - 05_containment_rollback
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMARK_ADAPTER: ${{ inputs.adapter }}
      BENCHMARK_ADAPTER_CONFIG: ${{ inputs.adapter_config }}
      BENCHMARK_TIMEOUT: ${{ inputs.timeout }}
      BENCHMARK_CHALLENGE: ${{ matrix.challenge }}
      BENCHMARK_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark
        run: python -m pip install --disable-pip-version-check .
      - name: Run isolated MEA attempt and archive evidence
        run: bash scripts/run_attempt_job.sh
      - name: Upload private attempt evidence
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: always()
        with:
          name: attempt-${{ matrix.challenge }}-seed-${{ matrix.seed }}
          path: |
            attempt-*.tar.gz
            attempt-*.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14
